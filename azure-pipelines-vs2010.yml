trigger:
  branches:
    include:
      - master

pool:
  vmImage: windows-2022

steps:
  - task: MSBuild@1
    displayName: Build VS2010 solution
    inputs:
      solution: 'itextsharp(VS2010).sln'
      msbuildVersion: latest
      platform: Any CPU
      configuration: Release
      msbuildArguments: '-restore -tv:Current'
